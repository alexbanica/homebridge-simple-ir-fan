name: Publish Forgejo npm Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-forgejo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://forgejo.alexlab.nl/api/packages/public/npm/

      - name: Install dependencies
        run: npm ci

      - name: Publish to Forgejo
        run: npm run publish:forgejo
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
