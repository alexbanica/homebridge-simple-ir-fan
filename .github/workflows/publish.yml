name: Publish Forgejo npm Package

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: publish-forgejo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-slim

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://forgejo.alexlab.nl/api/packages/public/npm/

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Publish to Forgejo
        run: npm run publish:forgejo
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
